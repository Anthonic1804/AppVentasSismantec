plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.10-1.0.13' // Usa la versión compatible con tu Kotlin
}


android {

    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
    }

    compileSdkVersion 34

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "com.example.acae30"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.example.acae30'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib: $kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'

    // SCANNER CAMARA
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.1'

    //LIBRERIA PARA EL USUARIO DE LA SIGNATURE VIEW
    //implementation 'com.kyanogen.signatureview:signature-view:1.2'
    implementation 'com.github.gcacace:signature-pad:1.3.1'

    //LIBRERIA PARA EXPORTAR PDF
    //implementation 'com.itextpdf:itextpdf:5.5.13.2'
    implementation 'com.itextpdf:itextg:5.5.10'

    //Picasso
    implementation "com.squareup.picasso:picasso:2.71828"

    //Lottie
    implementation "com.airbnb.android:lottie:6.0.0"
    implementation 'androidx.activity:activity:1.8.0'

    //GOOGLE MAPS
    implementation "com.google.android.gms:play-services-maps:19.0.0"

    //RETROFIT
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    //ROOM
    implementation "androidx.room:room-runtime:2.6.1"
    //kapt "androidx.room:room-compiler:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    //IMPLEMENTANDO LIBRERIA ESCPOSTPRINTER
    implementation files('libs/escposprinter-release.aar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


}